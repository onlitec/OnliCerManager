appId: com.onlicert.manager
productName: OnliCert Manager
copyright: Copyright © 2024 OnliCert Manager Contributors

directories:
  output: dist-release
  buildResources: resources

npmRebuild: false

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - "!node_modules/.cache"
  - "!**/*.map"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  publisherName: OnliCert Manager

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OnliCert Manager

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  # Pinned so scripts and .desktop entries don't depend on how electron-builder
  # happens to sanitise the product name.
  executableName: onlicert-manager
  maintainer: OnliCert Manager Contributors <galvatec@gmail.com>
  vendor: OnliCert Manager Contributors
  synopsis: Local Certificate Authority and TLS certificate manager
  description: |
    Create a local Certificate Authority, issue TLS certificates for your
    internal services, and deploy them to Proxmox, MikroTik, NGINX, Apache,
    Traefik, Docker, TrueNAS, Samba or any SSH host. All cryptography is
    delegated to the OpenSSL binary; private keys are stored AES-256-GCM
    encrypted. Everything runs locally, with no cloud service or account.
  desktop:
    entry:
      Name: OnliCert Manager
      Comment: Manage a local Certificate Authority and TLS certificates
      Categories: Utility;Network;Security;
      Keywords: certificate;ssl;tls;openssl;ca;pki;

appImage:
  # productName contains a space, so the default would emit
  # "OnliCert Manager-0.1.2.AppImage" — and GitHub rewrites spaces to dots on
  # upload, which would leave the filename in the README wrong.
  artifactName: OnliCert-Manager-${version}.${ext}

deb:
  # Debian convention: lowercase name, underscores, and the Debian arch name.
  artifactName: onlicert-manager_${version}_${arch}.${ext}
  # OpenSSL is invoked as an external binary, so it is a hard runtime dependency.
  depends:
    - openssl
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libxcb-dri3-0

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.utilities

publish:
  provider: github
  owner: onlitec
  repo: OnliCerManager
