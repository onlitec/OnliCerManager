name: Release (Linux)

# Builds the Linux packages and attaches them to the GitHub release for the tag.
# Linux artifacts are produced here rather than locally because the project is
# developed on Windows and electron-builder cannot cross-build a .deb/AppImage
# from there.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build AppImage & .deb
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target tag
        id: target
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install system dependencies
        # openssl is a runtime dependency of the app itself; fakeroot/dpkg/rpm
        # let electron-builder assemble the .deb and AppImage; build-essential
        # and python3 are needed by node-gyp when better-sqlite3 has to be
        # compiled from source for Electron's ABI.
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl fakeroot dpkg rpm build-essential python3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules against Electron
        # better-sqlite3 installs a binary built for the Node ABI (115 for
        # Node 20), but it has to load inside Electron 33, which is ABI 130.
        # electron-builder skips this because npmRebuild is disabled, so do it
        # explicitly — otherwise the app packages fine and then dies the first
        # time it opens its database.
        run: pnpm --filter desktop exec electron-builder install-app-deps

      - name: Generate PDF manual
        run: node apps/desktop/scripts/generate_pdf_manual.js

      - name: Compile Electron main process
        run: pnpm --filter desktop build:electron

      - name: Build renderer
        run: pnpm --filter desktop build:renderer

      - name: Package Linux targets
        # --publish never: artifacts are uploaded explicitly below, so a failed
        # smoke test can still stop them from reaching the release.
        run: pnpm --filter desktop exec electron-builder --linux --publish never

      - name: Verify native modules load under Electron
        run: |
          ELECTRON_RUN_AS_NODE=1 \
            "apps/desktop/dist-release/linux-unpacked/onlicert-manager" \
            scripts/verify_native_modules.js \
            "apps/desktop/dist-release/linux-unpacked"

      - name: List artifacts
        run: ls -lh apps/desktop/dist-release/*.AppImage apps/desktop/dist-release/*.deb

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A tag push runs this workflow immediately, which can beat the
          # release being created by hand — so create it if it isn't there.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "OnliCert Manager $TAG" --generate-notes

          gh release upload "$TAG" \
            apps/desktop/dist-release/*.AppImage \
            apps/desktop/dist-release/*.deb \
            --repo "$REPO" \
            --clobber

      - name: Keep artifacts on the workflow run too
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/dist-release/*.AppImage
            apps/desktop/dist-release/*.deb
          if-no-files-found: error
