name: Release

# Builds the distributable packages for every platform and attaches them to the
# GitHub release for the tag.
#
# Releases are built here rather than on a maintainer's machine on purpose: a
# local checkout can carry native modules left over from an earlier rebuild, so
# a build that works locally proves nothing about a clean one. Every artifact
# published should come from a clean checkout of the tagged commit.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to (e.g. v0.1.3)"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    # Git Bash on the Windows runner, so one script works on both platforms.
    shell: bash

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't cancel the other platform when one fails — knowing whether a
      # failure is platform-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage + .deb)
            platform: linux
            unpacked: linux-unpacked
            binary: onlicert-manager
          - os: windows-latest
            label: Windows (installer + portable)
            platform: win
            unpacked: win-unpacked
            binary: OnliCert Manager.exe

    steps:
      - name: Resolve target tag
        id: target
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install system dependencies
        if: runner.os == 'Linux'
        # openssl is a runtime dependency of the app itself; fakeroot/dpkg/rpm
        # let electron-builder assemble the .deb and AppImage; build-essential
        # and python3 are needed by node-gyp when a native module has to be
        # compiled from source. The Windows runner already ships MSVC and
        # Python, and OpenSSL with Git for Windows.
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl fakeroot dpkg rpm build-essential python3 xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules against Electron
        # better-sqlite3 installs a binary built for the Node ABI, but it has to
        # load inside Electron, which uses a different one. electron-builder
        # skips this because npmRebuild is disabled, so do it explicitly —
        # otherwise the app packages fine and then dies the first time it opens
        # its database. Rebuilds only the modules that need it; see the script
        # for why install-app-deps can't be used here.
        run: pnpm rebuild:native

      - name: Fetch bundled OpenSSL
        if: runner.os == 'Windows'
        # Windows has no system OpenSSL, so it ships inside the app. The script
        # pins the archive by SHA-256 and fails the build on a mismatch rather
        # than bundling an unverified crypto binary.
        run: pnpm fetch:openssl

      - name: Generate PDF manual
        run: node apps/desktop/scripts/generate_pdf_manual.js

      - name: Compile Electron main process
        run: pnpm --filter desktop build:electron

      - name: Build renderer
        run: pnpm --filter desktop build:renderer

      - name: Verify the renderer actually mounts
        # A renderer that throws while loading yields a blank window and a clean
        # exit code — packaging succeeds and the release ships broken, as 0.1.6
        # did. This loads the built bundle in a headless Electron window and
        # fails if nothing renders.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm verify:renderer

      - name: Package ${{ matrix.platform }} targets
        # --publish never: artifacts are uploaded explicitly below, so a failed
        # smoke test can still stop a broken build from reaching the release.
        run: pnpm --filter desktop exec electron-builder --${{ matrix.platform }} --publish never

      - name: Verify native modules load under Electron
        run: |
          ELECTRON_RUN_AS_NODE=1 \
            "apps/desktop/dist-release/${{ matrix.unpacked }}/${{ matrix.binary }}" \
            scripts/verify_native_modules.js \
            "apps/desktop/dist-release/${{ matrix.unpacked }}"

      - name: End-to-end tests against the packaged app
        # Drives the packaged binary through its real IPC bridge: creates a CA,
        # issues a certificate, resolves the manual out of the asar archive.
        # Every one of these guards a defect that shipped in a release because
        # lint, typecheck and the unit tests all passed.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm test:e2e

      - name: Upload e2e artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.platform }}
          path: apps/desktop/test-results
          if-no-files-found: ignore

      - name: Collect artifacts
        id: collect
        # Keep the list of what gets published in one place, and fail loudly if
        # a target silently produced nothing.
        run: |
          mkdir -p upload
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp apps/desktop/dist-release/*.AppImage upload/
            cp apps/desktop/dist-release/*.deb upload/
          else
            cp apps/desktop/dist-release/*.exe upload/
            cp apps/desktop/dist-release/*.exe.blockmap upload/
            cp apps/desktop/dist-release/*-win-portable.zip upload/
          fi
          ls -lh upload/
          [ -n "$(ls -A upload)" ] || { echo "no artifacts produced"; exit 1; }

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A tag push runs this workflow immediately, which can beat the
          # release being created by hand — so create it if it isn't there.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "OnliCert Manager $TAG" --generate-notes

          gh release upload "$TAG" upload/* --repo "$REPO" --clobber

      - name: Keep artifacts on the workflow run too
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-packages
          path: upload/*
          if-no-files-found: error
